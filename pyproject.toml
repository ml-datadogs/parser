[project]
name = "parser"
version = "0.1.0"
description = "Multi-site Scrapy scraper with Bright Data proxy and ClickHouse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scrapy>=2.11.2",
    "python-dotenv>=1.0.1",
    "clickhouse-connect>=0.7.19",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
